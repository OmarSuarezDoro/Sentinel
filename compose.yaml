services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configura POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Configura POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
    volumes:
      - ./infrastructure/postgres/data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: [npx, prisma, migrate, deploy]
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      [
        "./infrastructure/storage/attachments:/app/infrastructure/storage/attachments",
      ]
    networks: [internal, outbound]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: [node, dist/jobs/worker.js]
    networks: [internal, outbound]
    depends_on:
      migrate: { condition: service_completed_successfully }
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    networks: [internal]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./infrastructure/proxy/nginx.conf:/etc/nginx/nginx.conf:ro"]
    networks: [internal, outbound]
    depends_on:
      frontend: { condition: service_healthy }
networks:
  internal:
    internal: true
  outbound: {}
